name: Upstream extended validation (disabled in XELO fork)

# The inherited validation workflow used elevated integration tests and the
# default, nonfree-enabled make target. Restore only after a free-build audit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intentionally-disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "See docs/xelo/PHASE0.md before re-enabling upstream validation."
