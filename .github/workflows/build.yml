name: XELO - MPL-only build validation

# Fork-specific CI. Do not build, package, or publish the nonfree controller.
on:
  pull_request:
  push:
    branches:
      - dev
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-free:
    name: Linux x64 / MPL-only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev nlohmann-json3-dev python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test XELO free-build guard
        run: python3 -m unittest discover -s tests/xelo_phase0 -p 'test_*.py' -v

      - name: Bootstrap header-only OpenTelemetry API
        run: bash scripts/bootstrap-deps.sh

      - name: Configure MPL-only daemon
        run: cmake --preset linux-free-release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Enforce free-build configuration and compiled-source boundary
        run: |
          python3 scripts/xelo_verify_free_build.py --cache build-linux-free-release/CMakeCache.txt --compile-commands build-linux-free-release/compile_commands.json

      - name: Build daemon and upstream self-test
        run: cmake --build --preset linux-free-release --parallel 2

      - name: Execute upstream self-test
        run: ./build-linux-free-release/zerotier-selftest

  windows-free:
    name: Windows x64 / MPL-only
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Discover vcpkg installation
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = 'C:\vcpkg' }
          if (-not (Test-Path (Join-Path $root 'scripts\buildsystems\vcpkg.cmake'))) {
            throw "vcpkg not found at $root; update this CI setup for the runner image."
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test XELO free-build guard
        run: python -m unittest discover -s tests/xelo_phase0 -p 'test_*.py' -v

      - name: Bootstrap Windows x64 OpenTelemetry API
        shell: pwsh
        run: |
          .\scripts\bootstrap-deps.ps1 -Arch x64
          if ($LASTEXITCODE -ne 0) { throw 'Dependency bootstrap failed' }

      - name: Configure MPL-only daemon
        run: cmake --preset windows-x64-free

      - name: Enforce free-build CMake configuration
        run: python scripts/xelo_verify_free_build.py --cache build-windows-x64-free/CMakeCache.txt

      - name: Build MPL-only daemon
        run: cmake --build --preset windows-x64-free-release --parallel 2

# No artifact upload or distribution until the full dependency/license audit
# and release approval are complete.
